name: Release

# Main warms caches visible to subsequent tags. Only v* tags publish releases
# or versioned images; branch builds only update the registry build cache.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  GOFLAGS: -mod=readonly

jobs:
  verify:
    name: Tests and deployment checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-cache
        id: go-cache
        with:
          target: test
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
          node client/web/battle_target_async_test.js
          node client/web/battle_target_rules_test.js
          node client/web/battle_result_test.js
          node client/web/battle_speed_test.js
          node client/web/battle_resource_test.js
          node client/web/connection_retry_test.js
          node client/web/login_credentials_test.js
          node client/web/mobile_interaction_test.js
          node client/web/npc_interaction_test.js
          node client/web/pet_training_test.js
          node client/web/resource_loading_test.js
          node client/web/loading_diagnostics_test.js
          node client/web/resource_progress_test.js
          node client/web/asset_cache_test.js
          node client/web/asset_index_test.js
          node client/web/album_test.js
          node client/web/ride_test.js
          node client/web/server_directory_test.js
          node client/web/sprite_loading_test.js
          node client/web/sw_cache_test.js
          node client/web/world_frame_test.js
          node client/web/ai_observation_test.js
          node client/web/chat_identity_test.js
          node --test client/web/automation_catalog_test.js client/web/automation_battle_test.js client/web/automation_pet_test.js client/web/automation_recovery_test.js client/web/automation_supply_test.js
          node internal/admin/app_time_test.js
          node internal/admin/audit_test.js
          node internal/admin/players_test.js
          node internal/admin/gifts_test.js
          node internal/admin/ai_test.js
          node internal/admin/ai_model_connection_test.js
          node internal/admin/ai_audit_test.js
          node internal/admin/ai_recovery_test.js
          node internal/admin/ai_initial_test.js
          node internal/admin/ai_profile_view_race_test.js
          node internal/admin/ai_initial_recovery_test.js
          python3 server/legacy/modern/tests/test-saac-admin-bridge.py
          python3 server/legacy/modern/tests/test-gmsv-admin-guards.py
          python3 server/legacy/modern/tests/test-gmsv-admin-save-identity.py
          python3 server/legacy/modern/tests/test-gmsv-trusted-gateway.py
          python3 server/legacy/modern/tests/test-gmsv-ride-level.py
          python3 server/legacy/modern/tests/test-gmsv-white-tiger-ride.py
          python3 server/legacy/modern/tests/test-gmsv-enemy-bounds.py
          python3 server/legacy/modern/tests/test-gmsv-idle-netloop.py
          python3 server/legacy/modern/tests/test-ai-funding.py
          python3 server/legacy/modern/tests/test-ai-observation.py
          python3 server/legacy/modern/tests/test-ai-initialize.py
          python3 server/legacy/modern/tests/test-character-identity.py
          python3 server/legacy/modern/tests/test-chat-identity.py
          python3 server/legacy/modern/tests/test-person-identity.py
          STONEAGE_NATIVE_PERSON_FIXTURE="$PWD/build/ai/person-identity/native-fixture.json" go test -mod=readonly ./internal/aigame -run '^TestNativePersonIdentityFixture$'
      - name: Verify production deployment tools
        run: |
          python3 scripts/modernize-object-cstring_test.py
          python3 scripts/aliyun-certificate_test.py
          bash scripts/runtime-entrypoint_test.sh
          bash bin/registry-login_test.sh
          bash bin/sync-assets_test.sh
          bash bin/clean-images_test.sh
          python3 scripts/test-deployment-package.py
          python3 scripts/build-release-target_test.py
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.hit != 'true'
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: ${{ steps.go-cache.outputs.key }}

  binaries:
    name: Binaries (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64}
          - {os: darwin, arch: arm64}
          - {os: darwin, arch: amd64}
          - {os: windows, arch: amd64}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/vendor/
            !/client/web/assets/
            !/server/legacy/
            !/reference/
      - uses: ./.github/actions/setup-go-cache
        id: go-cache
        with:
          target: ${{ matrix.os }}-${{ matrix.arch }}
      - name: Install nfpm for the Linux packages
        if: matrix.os == 'linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
      - name: Build platform artifacts
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.0' }}
          RELEASE_STAGE: ${{ runner.temp }}/stoneage-release
        run: bash scripts/build-release-target.sh '${{ matrix.os }}' '${{ matrix.arch }}'
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.hit != 'true'
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: ${{ steps.go-cache.outputs.key }}
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  images:
    name: Image (${{ matrix.image }})
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: control-plane
            file: deploy/linux/Dockerfile
            target: control-plane
            platforms: linux/amd64,linux/arm64
          - image: ai-runtime
            file: deploy/linux/Dockerfile
            target: ai-runtime
            platforms: linux/amd64,linux/arm64
          - image: legacy-runtime
            file: deploy/linux/legacy-runtime.Dockerfile
            target: legacy-runtime
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/vendor/
            !/client/web/assets/
            !/reference/
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image with persistent registry cache
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          build-args: |
            RELEASE_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
            CODEX_CLI_VERSION=0.154.0
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.ref_name }}
          provenance: true
          # Registry caches cross tag boundaries; separate refs prevent the
          # two Dockerfiles from replacing each other's cache records.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.image }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
      - name: Record immutable image reference
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.ref_name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p dist
          test -n "$IMAGE_DIGEST"
          printf '%s@%s\n' "$IMAGE_REF" "$IMAGE_DIGEST" > 'dist/digest-${{ matrix.image }}'
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-digest-${{ matrix.image }}
          path: dist/digest-*
          retention-days: 2
          if-no-files-found: error

  # Package-manager distribution runs after the release exists, because the
  # formula and manifest carry the checksums of the published archives. The
  # token needs contents:write on k0ngk0ng/homebrew-tap and on the Scoop
  # bucket; without it the step warns and the release stays green.
  packages:
    name: Publish Homebrew formula and Scoop manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to the tap and the bucket
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          SCOOP_DEPLOY_KEY: ${{ secrets.SCOOP_DEPLOY_KEY }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ] && [ -z "$SCOOP_DEPLOY_KEY" ] && [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "::warning::no package-repository credential is configured; skipping the Homebrew and Scoop publish"
            exit 0
          fi
          bash scripts/publish-homebrew-formula.sh "$TAG"
          bash scripts/publish-scoop-manifest.sh "$TAG"

  publish:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, binaries, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Assemble image digests and checksums
        working-directory: dist
        run: |
          cat digest-control-plane digest-ai-runtime digest-legacy-runtime > IMAGE-DIGESTS
          rm digest-control-plane digest-ai-runtime digest-legacy-runtime
          sha256sum ./* > SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: dist/*
