name: Release

# Releases are intentionally cut only from an explicitly pushed v* tag.  Pull
# requests and branch pushes must never publish an artifact or mutate a GitHub
# release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Verify production deployment tools
        run: |
          bash bin/registry-login_test.sh
          python3 scripts/test-deployment-package.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push control-plane image
        id: control-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/linux/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/control-plane:${{ github.ref_name }}
          provenance: true

      - name: Build and push legacy runtime image
        id: legacy-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/linux/legacy-runtime.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/legacy-runtime:${{ github.ref_name }}
          provenance: true

      - name: Build control-plane artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          stage="${RUNNER_TEMP}/stoneage-release"
          dist="${GITHUB_WORKSPACE}/dist"
          rm -rf "$stage" "$dist"
          mkdir -p "$stage" "$dist"

          build_target() {
            local goos="$1"
            local goarch="$2"
            local suffix="$3"
            local package_root="$stage/stoneage-control-plane-${RELEASE_TAG}-${goos}-${goarch}"
            local bin_root="$package_root/bin"

            mkdir -p "$bin_root"
            commands=(stoneage-gateway stoneage-admin stoneage-operator)
            if [[ "$goos" == linux ]]; then
              # The uploader is a separate, one-shot control-plane utility;
              # it is shipped with Linux artifacts but is never started as a
              # long-running web/admin service.
              commands+=(stoneage-web stoneage-assets-sync)
            fi
            for command in "${commands[@]}"; do
              local output="$bin_root/$command$suffix"
              local package="./cmd/$command"
              if [[ "$command" == stoneage-web ]]; then
                package="./client/web"
              fi
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                go build -trimpath -ldflags='-s -w' -o "$output" "$package"
            done

            cp README.md "$package_root/README.md"
            mkdir -p "$package_root/docs"
            cp docs/database.md docs/networking.md docs/development.md "$package_root/docs/"

            if [[ "$goos" == linux ]]; then
              cp release/linux/start-admin.sh \
                release/linux/stop-admin.sh \
                release/linux/status-admin.sh \
                release/linux/start-game.sh \
                release/linux/stop-game.sh \
                release/linux/start-gateway.sh \
                release/linux/stop-gateway.sh \
                release/linux/restart-server.sh \
                release/linux/restart-game.sh \
                release/linux/restart-gmsv.sh \
                release/linux/restart-saac.sh \
                release/linux/stop-gmsv.sh \
                release/linux/stop-saac.sh \
                release/linux/restart-gateway.sh \
                release/linux/send-notification.sh \
                "$package_root/"
            fi

            (cd "$stage" && tar -czf "$dist/stoneage-control-plane-${RELEASE_TAG}-${goos}-${goarch}.tar.gz" \
              "$(basename "$package_root")")
          }

          build_target linux amd64 ''
          build_target darwin arm64 ''
          build_target windows amd64 '.exe'

          (cd "$stage" && zip -q -r -9 "$dist/stoneage-control-plane-${RELEASE_TAG}-windows-amd64.zip" \
            "stoneage-control-plane-${RELEASE_TAG}-windows-amd64")
          rm -f "$dist/stoneage-control-plane-${RELEASE_TAG}-windows-amd64.tar.gz"

          (cd "$dist" && sha256sum * > SHA256SUMS)

      - name: Package Compose deployment
        run: python3 scripts/package-deployment.py "${{ github.ref_name }}"

      - name: Write image digest manifest
        env:
          CONTROL_DIGEST: ${{ steps.control-image.outputs.digest }}
          LEGACY_DIGEST: ${{ steps.legacy-image.outputs.digest }}
        run: |
          set -euo pipefail
          cat > dist/IMAGE-DIGESTS <<EOF
          ghcr.io/${{ github.repository }}/control-plane:${{ github.ref_name }}@${CONTROL_DIGEST}
          ghcr.io/${{ github.repository }}/legacy-runtime:${{ github.ref_name }}@${LEGACY_DIGEST}
          EOF
          (cd dist && sha256sum $(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n') > SHA256SUMS)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/stoneage-deploy-${{ github.ref_name }}.tar.gz
            dist/stoneage-control-plane-${{ github.ref_name }}-linux-amd64.tar.gz
            dist/stoneage-control-plane-${{ github.ref_name }}-darwin-arm64.tar.gz
            dist/stoneage-control-plane-${{ github.ref_name }}-windows-amd64.zip
            dist/IMAGE-DIGESTS
            dist/SHA256SUMS
