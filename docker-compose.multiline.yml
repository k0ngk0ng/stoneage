# Local/prototype overlay: one shared SAAC, two independent GMSV lines, and
# one multi-listener protocol gateway. The base compose file remains the
# single-line production default; use scripts/start-local-multiline.sh to
# select safe host ports when the default local stack is already running.
services:
  gmsv2:
    image: alpine:3.22
    container_name: ${STONEAGE_GMSV2_CONTAINER:-stoneage-multiline-gmsv2}
    init: true
    restart: unless-stopped
    depends_on:
      saac:
        condition: service_healthy
    environment:
      STONEAGE_SAAC_HOST: saac
      STONEAGE_SAAC_PORT: 9300
      STONEAGE_SAAC_CHAR_DIR: /shared-saac/char
    volumes:
      - ${STONEAGE_RUNTIME_ROOT_LINE2:-./runtime/legacy-server-line2}:/game
      - ${STONEAGE_RUNTIME_ROOT:-./runtime/legacy-server}/saac:/shared-saac
      - ./server/legacy/modern/run-gmsv.sh:/modern/run-gmsv.sh:ro
    command: ["sh", "/modern/run-gmsv.sh"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9065"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 10s

  gateway:
    depends_on:
      gmsv2:
        condition: service_healthy
    command:
      - /opt/stoneage/bin/stoneage-gateway
      - -routes
      - ${STONEAGE_GATEWAY_ROUTES:-0.0.0.0:9065=gmsv:9065;0.0.0.0:9066=gmsv2:9065}
      - -auth-required
      - -auth-db
      - /data/stoneage-auth.db
    environment:
      STONEAGE_GATEWAY_ROUTES: ${STONEAGE_GATEWAY_ROUTES:-0.0.0.0:9065=gmsv:9065;0.0.0.0:9066=gmsv2:9065}
    ports:
      # The launcher should point line 1 and line 2 at these two host ports.
      # The start script changes the first port to 9066 when the old local
      # gateway already owns 9065.
      - ${STONEAGE_GATEWAY_BIND:-127.0.0.1}:${STONEAGE_GATEWAY_PORT:-9065}:9065
      - ${STONEAGE_GATEWAY_BIND:-127.0.0.1}:${STONEAGE_GATEWAY_PORT_2:-9066}:9066
