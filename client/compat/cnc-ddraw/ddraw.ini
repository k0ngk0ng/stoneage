; StoneAge 2.5 compatibility profile for cnc-ddraw 7.1.0.0.
; The original client draws an indexed 640x480 surface and requires a
; 256-colour palette. cnc-ddraw keeps that virtual 8-bit surface while the
; host desktop remains in its modern colour mode.

[ddraw]
width=960
height=720
fullscreen=false
windowed=true
maintas=true
aspect_ratio=4:3
boxing=false
maxfps=-1
vsync=false
adjmouse=true
shader=
posX=-32000
posY=-32000
renderer=gdi
devmode=true
border=true
savesettings=0
resizable=true
center_window=2

; Compatibility settings for the 2002 DirectDraw 2 client.
noactivateapp=false
maxgameticks=60
limiter_type=0
minfps=10
nonexclusive=true
singlecpu=false
resolutions=1
fixchilds=2
hook_peekmessage=false
fake_mode=640x480x8
hook=4

; Keep testing convenient. These can be changed later for a locked cursor.
keytogglefullscreen=0x00
keytogglefullscreen2=0x00
keytogglemaximize=0x22
keytogglemaximize2=0x00
keyunlockcursor1=0x09
keyunlockcursor2=0xA3
keyscreenshot=0x2C
