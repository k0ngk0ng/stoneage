{{define "content"}}
<div class="page-heading"><div><h1>审计日志</h1><p class="muted">最近 100 条管理和登录事件</p></div></div>
<div class="table-wrap"><table>
<thead><tr><th>时间</th><th>操作者</th><th>事件</th><th>账号</th><th>来源</th><th>详情</th></tr></thead>
<tbody>{{range .Events}}<tr><td>{{.CreatedAt.Format "2006-01-02 15:04:05"}}</td><td>{{if .ActorID}}管理员 #{{.ActorID}}{{else}}系统{{end}}</td><td>{{.Event}}</td><td>{{.Username}}</td><td>{{.SourceIP}}</td><td>{{.Detail}}</td></tr>{{else}}<tr><td colspan="6" class="empty">暂无事件</td></tr>{{end}}</tbody>
</table></div>
{{end}}
