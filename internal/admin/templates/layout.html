{{define "layout"}}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · StoneAge Revival</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="brand">StoneAge Revival</div>
  {{if .Session}}
  <nav>
    <a href="/accounts">账号</a>
    <a href="/audit">审计</a>
    <a href="/server">服务</a>
    <a href="/notifications">通知</a>
    <a href="/assets">资源</a>
  </nav>
  <form method="post" action="/logout" class="logout">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <span>{{.Session.Username}}</span>
    <button type="submit">退出</button>
  </form>
  {{end}}
</header>
<main class="container">
  {{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}
  {{if .Message}}<div class="alert success">{{.Message}}</div>{{end}}
  {{template "content" .}}
</main>
<div class="confirm-modal" id="confirm-modal" hidden>
  <div class="confirm-backdrop" data-confirm-cancel tabindex="-1"></div>
  <section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message" tabindex="-1">
    <div class="confirm-mark" aria-hidden="true">!</div>
    <div class="confirm-copy">
      <span class="section-kicker">请确认</span>
      <h2 id="confirm-title">确认操作</h2>
      <p id="confirm-message"></p>
    </div>
    <div class="confirm-actions">
      <button class="button" type="button" data-confirm-cancel>取消</button>
      <button class="primary" type="button" data-confirm-accept>确认</button>
    </div>
  </section>
</div>
</body>
</html>
{{end}}
