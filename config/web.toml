listen_address = "0.0.0.0:8088"
tcp_upstream = "gateway:9065"
packet_limit = 4194304
max_sessions = 64
poll_timeout = "25s"
idle_timeout = "10m"
dial_timeout = "5s"
allowed_origin = ""

[static]
assets_directory = "/opt/stoneage/web-assets"
maps_directory = "/game/client/map"
audio_directory = "/game/client/data"
npc_directory = "/game/gmsv/data/npc"

# Storage provider used by the one-shot asset uploader.  Supported values are
# "aliyun-oss" and "cloudflare-r2".  The Web process only uses this section
# to derive a public Aliyun fallback URL; it never reads credentials.
[static.oss]
provider = "aliyun-oss"
endpoint = ""
region = ""
bucket = ""
prefix = "stoneage"

[static.cdn]
# Set your public HTTPS asset root, for example https://cdn.example.com/stoneage.
# It must contain assets/, maps/ and audio/. Leave empty for local resources
# when no public OSS origin is configured. A non-empty STONEAGE_WEB_CDN_BASE_URL
# environment variable overrides this value. Setting this does not upload files.
base_url = ""
