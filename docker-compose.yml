# Production single-line deployment for one Linux host:
#   saac -> gmsv -> gateway
#              └-> service-control -> admin
#
# Keep docker-compose.multiline.yml as an optional overlay when the same host
# needs more than one independent GMSV line. Do not expose GMSV or SAAC ports
# on the host; only the gateway and (optionally) the admin UI are published.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${STONEAGE_LOG_MAX_SIZE:-10m}
    max-file: ${STONEAGE_LOG_MAX_FILE:-5}

services:
  # SAAC is the shared account/character service. Multiple GMSV line services
  # can point at this container when more than one game line is deployed.
  saac:
    image: alpine:3.22
    container_name: ${STONEAGE_SAAC_CONTAINER:-stoneage-saac}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - backend
    volumes:
      - ${STONEAGE_RUNTIME_ROOT:-./runtime/legacy-server}:/game
      - ./server/legacy/modern/run-saac.sh:/modern/run-saac.sh:ro
    command: ["sh", "/modern/run-saac.sh"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9300"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 10s

  # One GMSV is one game line. Add another GMSV service for another line while
  # continuing to share SAAC; the single gateway process can route multiple
  # listener ports to those GMSV services.
  gmsv:
    image: alpine:3.22
    container_name: ${STONEAGE_GMSV_CONTAINER:-stoneage-gmsv}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - backend
    depends_on:
      saac:
        condition: service_healthy
    environment:
      STONEAGE_SAAC_HOST: saac
      STONEAGE_SAAC_PORT: 9300
    volumes:
      - ${STONEAGE_RUNTIME_ROOT:-./runtime/legacy-server}:/game
      - ./server/legacy/modern/run-gmsv.sh:/modern/run-gmsv.sh:ro
    command: ["sh", "/modern/run-gmsv.sh"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9065"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: deploy/linux/Dockerfile
    image: ${STONEAGE_CONTROL_IMAGE:-stoneage-control-plane:local}
    container_name: ${STONEAGE_GATEWAY_CONTAINER:-stoneage-gateway}
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *default-logging
    networks:
      - backend
    depends_on:
      gmsv:
        condition: service_healthy
    command:
      - /opt/stoneage/bin/stoneage-gateway
      - -routes
      - ${STONEAGE_GATEWAY_ROUTES:-0.0.0.0:9065=gmsv:9065}
      - -auth-required
      - -auth-db
      - /data/stoneage-auth.db
    environment:
      STONEAGE_AUTH_DB: /data/stoneage-auth.db
      STONEAGE_GATEWAY_ROUTES: ${STONEAGE_GATEWAY_ROUTES:-0.0.0.0:9065=gmsv:9065}
    volumes:
      - auth-data:/data
    ports:
      # Publish one host port for every listener in STONEAGE_GATEWAY_ROUTES.
      # The default exposes the first line only.
      - ${STONEAGE_GATEWAY_BIND:-127.0.0.1}:${STONEAGE_GATEWAY_PORT:-9065}:9065
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9065"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 5s

  # This is the privileged-but-fixed service control boundary. The web
  # container never receives the Docker socket.
  service-control:
    build:
      context: .
      dockerfile: deploy/linux/Dockerfile
    image: ${STONEAGE_CONTROL_IMAGE:-stoneage-control-plane:local}
    container_name: ${STONEAGE_OPERATOR_CONTAINER:-stoneage-service-control}
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *default-logging
    networks:
      - backend
    # Keep the control plane available even when a game service is stopped
    # or unhealthy; the web console must be able to start it again.
    command:
      - /opt/stoneage/bin/stoneage-operator
      - -package-root
      - /opt/stoneage/compose
      - -socket
      - /run/stoneage/operator.sock
      - -gateway
      - gateway:9065
      - -upstream
      - gmsv:9065
      - -saac
      - saac:9300
      - -auth-db
      - /data/stoneage-auth.db
    environment:
      STONEAGE_GAME_CONTAINER: ${STONEAGE_GMSV_CONTAINER:-stoneage-gmsv}
      STONEAGE_GMSV_CONTAINER: ${STONEAGE_GMSV_CONTAINER:-stoneage-gmsv}
      STONEAGE_SAAC_CONTAINER: ${STONEAGE_SAAC_CONTAINER:-stoneage-saac}
      STONEAGE_GATEWAY_CONTAINER: ${STONEAGE_GATEWAY_CONTAINER:-stoneage-gateway}
      STONEAGE_GAME_HOST: gmsv
      STONEAGE_GMSV_HOST: gmsv
      STONEAGE_SAAC_HOST: saac
      STONEAGE_GATEWAY_HOST: gateway
      STONEAGE_RUNTIME_MOUNT: /game
    volumes:
      - ${STONEAGE_RUNTIME_ROOT:-./runtime/legacy-server}:/game
      - auth-data:/data
      - operator-run:/run/stoneage
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/stoneage/operator.sock"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The authenticated web administration site (accounts, audit, services,
  # notifications and per-service configuration).
  admin:
    build:
      context: .
      dockerfile: deploy/linux/Dockerfile
    image: ${STONEAGE_CONTROL_IMAGE:-stoneage-control-plane:local}
    container_name: ${STONEAGE_ADMIN_CONTAINER:-stoneage-admin}
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *default-logging
    networks:
      - backend
    depends_on:
      service-control:
        condition: service_healthy
    command:
      - /opt/stoneage/bin/stoneage-admin
      - serve
      - -db
      - /data/stoneage-auth.db
      - -listen
      - 0.0.0.0:8080
      - -config
      - /game/gmsv/setup.cf
      - -saac-config
      - /game/saac/acserv.cf
      - -operator-socket
      - /run/stoneage/operator.sock
    environment:
      STONEAGE_ADMIN_USER: ${STONEAGE_ADMIN_USER:-}
      STONEAGE_ADMIN_PASSWORD: ${STONEAGE_ADMIN_PASSWORD:-}
      STONEAGE_ADMIN_SETUP_TOKEN: ${STONEAGE_ADMIN_SETUP_TOKEN:-}
      STONEAGE_ADMIN_COOKIE_SECURE: ${STONEAGE_ADMIN_COOKIE_SECURE:-false}
    volumes:
      - ${STONEAGE_RUNTIME_ROOT:-./runtime/legacy-server}:/game
      - auth-data:/data
      - operator-run:/run/stoneage:ro
    ports:
      - ${STONEAGE_ADMIN_BIND:-127.0.0.1}:${STONEAGE_ADMIN_PORT:-8080}:8080
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  auth-data:
    name: ${STONEAGE_AUTH_VOLUME:-stoneage-auth}
  operator-run:
    name: ${STONEAGE_OPERATOR_RUN_VOLUME:-stoneage-operator-run}

networks:
  # No host ports are published for GMSV/SAAC, so they remain private while
  # gateway/admin mappings continue to work on Docker Desktop and Linux.
  backend: {}
