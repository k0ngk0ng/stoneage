# Production single-line deployment for one Linux host:
#   saac -> gmsv -> gateway -> web client
#              └-> service-control -> admin
#
# This file is the single-machine, single-line production deployment. Do not
# expose GMSV or SAAC ports on the host; only the browser endpoint, gateway and
# (optionally) the admin UI are published.
name: ${STONEAGE_COMPOSE_PROJECT_NAME:-stoneage}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${STONEAGE_LOG_MAX_SIZE:-10m}
    max-file: ${STONEAGE_LOG_MAX_FILE:-5}

services:
  # SAAC is the shared account/character service. Its writable data is kept
  # outside the versioned image so a release cannot replace player records.
  saac:
    image: ${STONEAGE_LEGACY_IMAGE:-ghcr.io/k0ngk0ng/stoneage/legacy-runtime}:${STONEAGE_VERSION:-v0.1.16}
    container_name: ${STONEAGE_SAAC_CONTAINER:-stoneage-saac}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - backend
    environment:
      STONEAGE_RUNTIME_ROLE: saac
      STONEAGE_PLAYER_ADMIN_DIR: /run/stoneage/player-admin/saac
      STONEAGE_SAAC_CONFIG: /etc/stoneage/saac/acserv.cf
    volumes:
      - ${STONEAGE_SAAC_DATA_ROOT:-./data/saac}:/game/saac
      - ${STONEAGE_SAAC_CONFIG_DIR:-./config/saac}:/etc/stoneage/saac:ro
      - player-admin:/run/stoneage/player-admin
    command: ["/opt/stoneage/bin/run-saac.sh"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9300"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 10s

  # This single GMSV is the game service for the one-line deployment. Its
  # immutable maps/NPC definitions come from the legacy image; character
  # snapshots and logs remain in the GMSV/SAAC data directories.
  gmsv:
    image: ${STONEAGE_LEGACY_IMAGE:-ghcr.io/k0ngk0ng/stoneage/legacy-runtime}:${STONEAGE_VERSION:-v0.1.16}
    container_name: ${STONEAGE_GMSV_CONTAINER:-stoneage-gmsv}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - backend
    depends_on:
      saac:
        condition: service_healthy
    environment:
      STONEAGE_RUNTIME_ROLE: gmsv
      STONEAGE_PLAYER_ADMIN_DIR: /run/stoneage/player-admin/gmsv
      STONEAGE_GMSV_CONFIG: /etc/stoneage/gmsv/setup.cf
      # Only this exact internal gateway may multiplex pre-login clients.
      STONEAGE_GMSV_TRUSTED_GATEWAY_HOST: gateway
      STONEAGE_SAAC_HOST: saac
      STONEAGE_SAAC_PORT: 9300
      STONEAGE_BATTLE_RECORD_DIR: /var/lib/stoneage/battle-records
      STONEAGE_BATTLE_RECORD_MIN_FREE_BYTES: ${STONEAGE_BATTLE_RECORD_MIN_FREE_BYTES:-1073741824}
    volumes:
      - ${STONEAGE_GMSV_DATA_ROOT:-./data/gmsv}:/game/gmsv
      - ${STONEAGE_GMSV_CONFIG_DIR:-./config/gmsv}:/etc/stoneage/gmsv:ro
      - player-admin:/run/stoneage/player-admin
      # The legacy crash-recovery path is ../saac/char. Mount the shared SAAC
      # data explicitly without sharing the GMSV binary/static tree.
      - ${STONEAGE_SAAC_DATA_ROOT:-./data/saac}:/game/saac
      - ${STONEAGE_BATTLE_RECORD_ROOT:-./data/battle-records}:/var/lib/stoneage/battle-records
    command: ["/opt/stoneage/bin/run-gmsv.sh"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9065"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 10s

  gateway:
    image: ${STONEAGE_CONTROL_IMAGE:-ghcr.io/k0ngk0ng/stoneage/control-plane}:${STONEAGE_VERSION:-v0.1.16}
    container_name: ${STONEAGE_GATEWAY_CONTAINER:-stoneage-gateway}
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *default-logging
    networks:
      - backend
    depends_on:
      gmsv:
        condition: service_healthy
    command:
      - /opt/stoneage/bin/stoneage-gateway
      - -config
      - /etc/stoneage/gateway.toml
      - -auth-required
      - -auth-db
      - /data/${STONEAGE_AUTH_DB_FILE:-stoneage-auth.db}
    environment:
      STONEAGE_AUTH_DB: /data/${STONEAGE_AUTH_DB_FILE:-stoneage-auth.db}
      STONEAGE_GATEWAY_TRUSTED_PROXY_HOSTS: web
    volumes:
      - auth-data:/data
      - ${STONEAGE_GATEWAY_CONFIG_FILE:-./config/gateway/gateway.toml}:/etc/stoneage/gateway.toml:ro
    ports:
      # Publish the first native TCP line. Add ports here for additional native-client lines.
      - ${STONEAGE_GATEWAY_BIND:-127.0.0.1}:${STONEAGE_GATEWAY_PORT:-9065}:9065
    healthcheck:
      # The directory remains available even when all game lines are in maintenance.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9080 || nc -z 127.0.0.1 9065"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 5s

  # Browser client. It only reaches the authenticated gateway over the
  # private Compose network; the browser never receives a raw GMSV socket.
  # All public game resources are mounted read-only from the host.
  web:
    image: ${STONEAGE_CONTROL_IMAGE:-ghcr.io/k0ngk0ng/stoneage/control-plane}:${STONEAGE_VERSION:-v0.1.16}
    container_name: ${STONEAGE_WEB_CONTAINER:-stoneage-web}
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *default-logging
    networks:
      - backend
    depends_on:
      gateway:
        condition: service_healthy
    command: ["/opt/stoneage/bin/stoneage-web", "-config", "/etc/stoneage/web.toml"]
    environment:
      # Environment variables are emergency/secret-safe overrides. Normal
      # Web, object-storage and CDN settings live in the mounted TOML configuration.
      STONEAGE_WEB_FORWARD_CLIENT_IP: "true"
      STONEAGE_WEB_TRUSTED_PROXIES: ${STONEAGE_WEB_TRUSTED_PROXIES:-${STONEAGE_ADMIN_TRUSTED_PROXIES:-127.0.0.1/32,::1/128}}
      STONEAGE_WEB_MAX_SESSIONS: ${STONEAGE_WEB_MAX_SESSIONS:-64}
      STONEAGE_WEB_CDN_BASE_URL: ${STONEAGE_WEB_CDN_BASE_URL:-}
    volumes:
      - ${STONEAGE_WEB_CONFIG_FILE:-./config/web/web.toml}:/etc/stoneage/web.toml:ro
      - ${STONEAGE_SPRITES_ROOT:-./assets/sprites}:/opt/stoneage/web-assets:ro
      - ${STONEAGE_CLIENT_DATA_ROOT:-./assets/client}:/game/client:ro
      - ${STONEAGE_GMSV_DATA_ROOT:-./data/gmsv}:/game/gmsv:ro
    ports:
      - ${STONEAGE_WEB_BIND:-127.0.0.1}:${STONEAGE_WEB_PORT:-8088}:8088
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8088"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 5s

  # Client publication is a one-shot control-plane job, not part of the
  # browser or admin runtime.  It is opt-in via `--profile assets-sync` so an
  # ordinary deployment never uploads anything (and never needs storage keys).
  # The three trees are mounted together and published as one stable client
  # root: stoneage/{assets,maps,audio}/.
  assets-sync:
    platform: linux/amd64
    profiles: ["assets-sync"]
    image: ${STONEAGE_CONTROL_IMAGE:-ghcr.io/k0ngk0ng/stoneage/control-plane}:${STONEAGE_VERSION:-v0.1.16}
    init: true
    restart: "no"
    networks:
      - backend
    entrypoint: ["/opt/stoneage/bin/stoneage-assets-sync"]
    command:
      - -config
      - /etc/stoneage/web.toml
      - -assets
      - /opt/stoneage/web-assets
      - -client-data
      - /game/client
      - -workers
      - ${STONEAGE_ASSET_SYNC_WORKERS:-8}
    environment:
      # Credentials are Docker secrets, not Compose environment values. They
      # exist only in this short-lived uploader and are never visible to web,
      # gateway or admin HTTP containers.
      STONEAGE_ASSET_SYNC_ACCESS_KEY_FILE: /run/secrets/stoneage-oss-access-key-id
      STONEAGE_ASSET_SYNC_ACCESS_SECRET_FILE: /run/secrets/stoneage-oss-access-key-secret
    secrets:
      - stoneage-oss-access-key-id
      - stoneage-oss-access-key-secret
    volumes:
      - ${STONEAGE_WEB_CONFIG_FILE:-./config/web/web.toml}:/etc/stoneage/web.toml:ro
      - ${STONEAGE_SPRITES_ROOT:-./assets/sprites}:/opt/stoneage/web-assets:ro
      - ${STONEAGE_CLIENT_DATA_ROOT:-./assets/client}:/game/client:ro

  # This is the privileged-but-fixed service control boundary. The web
  # container never receives the Docker socket.
  service-control:
    image: ${STONEAGE_CONTROL_IMAGE:-ghcr.io/k0ngk0ng/stoneage/control-plane}:${STONEAGE_VERSION:-v0.1.16}
    container_name: ${STONEAGE_OPERATOR_CONTAINER:-stoneage-service-control}
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *default-logging
    networks:
      - backend
    # Keep the control plane available even when a game service is stopped
    # or unhealthy; the web console must be able to start it again.
    command:
      - /opt/stoneage/bin/stoneage-operator
      - -package-root
      - /opt/stoneage/compose
      - -socket
      - /run/stoneage/operator.sock
      - -gateway
      - gateway:9065
      - -upstream
      - gmsv:9065
      - -saac
      - saac:9300
      - -auth-db
      - /data/${STONEAGE_AUTH_DB_FILE:-stoneage-auth.db}
      - -project-root
      - /host-project
      - -compose-file
      - /host-project/docker-compose.yml
      - -project-host-root
      - ${STONEAGE_PROJECT_ROOT:-}
      - -control-image
      - ${STONEAGE_CONTROL_IMAGE:-ghcr.io/k0ngk0ng/stoneage/control-plane}
      - -legacy-image
      - ${STONEAGE_LEGACY_IMAGE:-ghcr.io/k0ngk0ng/stoneage/legacy-runtime}
      - -state
      - /state/deploy.status
      - -state-volume
      - ${STONEAGE_OPERATOR_STATE_VOLUME:-stoneage-operator-state}
      - -auth-volume
      - ${STONEAGE_AUTH_VOLUME:-stoneage-auth}
      - -gmsv-data-root
      - ${STONEAGE_GMSV_DATA_ROOT:-}
      - -saac-data-root
      - ${STONEAGE_SAAC_DATA_ROOT:-}
    environment:
      STONEAGE_GAME_CONTAINER: ${STONEAGE_GMSV_CONTAINER:-stoneage-gmsv}
      STONEAGE_GMSV_CONTAINER: ${STONEAGE_GMSV_CONTAINER:-stoneage-gmsv}
      STONEAGE_SAAC_CONTAINER: ${STONEAGE_SAAC_CONTAINER:-stoneage-saac}
      STONEAGE_GATEWAY_CONTAINER: ${STONEAGE_GATEWAY_CONTAINER:-stoneage-gateway}
      STONEAGE_GAME_HOST: gmsv
      STONEAGE_GMSV_HOST: gmsv
      STONEAGE_SAAC_HOST: saac
      STONEAGE_GATEWAY_HOST: gateway
      STONEAGE_RUNTIME_MOUNT: /game/gmsv
      STONEAGE_NOTICE_DIR: /game/gmsv
      STONEAGE_PROJECT_ROOT: ${STONEAGE_PROJECT_ROOT:-}
      STONEAGE_PROJECT_HOST_ROOT: ${STONEAGE_PROJECT_ROOT:-}
      STONEAGE_COMPOSE_FILE: ${STONEAGE_COMPOSE_FILE:-}
      STONEAGE_CONTROL_IMAGE: ${STONEAGE_CONTROL_IMAGE:-ghcr.io/k0ngk0ng/stoneage/control-plane}
      STONEAGE_LEGACY_IMAGE: ${STONEAGE_LEGACY_IMAGE:-ghcr.io/k0ngk0ng/stoneage/legacy-runtime}
      STONEAGE_GATEWAY_API_URL: ${STONEAGE_GATEWAY_API_URL:-http://gateway:9080}
      STONEAGE_OPERATOR_STATE_VOLUME: ${STONEAGE_OPERATOR_STATE_VOLUME:-stoneage-operator-state}
      STONEAGE_GMSV_DATA_ROOT: ${STONEAGE_GMSV_DATA_ROOT:-}
      STONEAGE_SAAC_DATA_ROOT: ${STONEAGE_SAAC_DATA_ROOT:-}
      STONEAGE_AUTH_VOLUME: ${STONEAGE_AUTH_VOLUME:-stoneage-auth}
      # The fixed sync script reads only the two storage secret files when an
      # admin explicitly starts a job. They are not injected into admin/web.
      STONEAGE_ASSET_SYNC_ACCESS_KEY_FILE: /run/secrets/stoneage-oss-access-key-id
      STONEAGE_ASSET_SYNC_ACCESS_SECRET_FILE: /run/secrets/stoneage-oss-access-key-secret
    volumes:
      - ${STONEAGE_GMSV_DATA_ROOT:-./data/gmsv}:/game/gmsv
      - ${STONEAGE_SAAC_DATA_ROOT:-./data/saac}:/game/saac
      - ${STONEAGE_WEB_CONFIG_FILE:-./config/web/web.toml}:/etc/stoneage/web.toml:ro
      - ${STONEAGE_SPRITES_ROOT:-./assets/sprites}:/opt/stoneage/web-assets:ro
      - ${STONEAGE_CLIENT_DATA_ROOT:-./assets/client}:/game/client:ro
      - auth-data:/data
      - operator-run:/run/stoneage
      - operator-state:/state
      # The host project is mounted separately so it does not hide the
      # operator binaries under /opt/stoneage. Release deployment additionally
      # requires STONEAGE_PROJECT_ROOT to be an absolute host path and all
      # data roots in the production .env to be absolute paths.
      - ${STONEAGE_PROJECT_ROOT:-.}:/host-project:ro
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - stoneage-oss-access-key-id
      - stoneage-oss-access-key-secret
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/stoneage/operator.sock"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The authenticated web administration site (accounts, audit, services,
  # notifications and per-service configuration).
  admin:
    image: ${STONEAGE_CONTROL_IMAGE:-ghcr.io/k0ngk0ng/stoneage/control-plane}:${STONEAGE_VERSION:-v0.1.16}
    container_name: ${STONEAGE_ADMIN_CONTAINER:-stoneage-admin}
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *default-logging
    networks:
      - backend
    depends_on:
      service-control:
        condition: service_healthy
    command:
      - /opt/stoneage/bin/stoneage-admin
      - serve
      - -db
      - /data/${STONEAGE_AUTH_DB_FILE:-stoneage-auth.db}
      - -listen
      - 0.0.0.0:8080
      - -config
      - /etc/stoneage/gmsv/setup.cf
      - -saac-config
      - /etc/stoneage/saac/acserv.cf
      - -operator-socket
      - /run/stoneage/operator.sock
      - -player-admin-root
      - /run/stoneage-player-admin
    environment:
      STONEAGE_ADMIN_USER: ${STONEAGE_ADMIN_USER:-}
      STONEAGE_ADMIN_PASSWORD: ${STONEAGE_ADMIN_PASSWORD:-}
      STONEAGE_ADMIN_SETUP_TOKEN: ${STONEAGE_ADMIN_SETUP_TOKEN:-}
      STONEAGE_ADMIN_COOKIE_SECURE: ${STONEAGE_ADMIN_COOKIE_SECURE:-false}
      STONEAGE_ADMIN_TRUSTED_PROXIES: ${STONEAGE_ADMIN_TRUSTED_PROXIES:-127.0.0.1/32,::1/128}
    volumes:
      - ${STONEAGE_GMSV_DATA_ROOT:-./data/gmsv}:/game/gmsv
      - ${STONEAGE_SAAC_DATA_ROOT:-./data/saac}:/game/saac
      - auth-data:/data
      - ${STONEAGE_GMSV_CONFIG_DIR:-./config/gmsv}:/etc/stoneage/gmsv
      - ${STONEAGE_SAAC_CONFIG_DIR:-./config/saac}:/etc/stoneage/saac
      - operator-run:/run/stoneage:ro
      # operator-run is read-only above, so keep this queue volume at a
      # sibling path instead of nesting a mount below the read-only volume.
      - player-admin:/run/stoneage-player-admin
      - ${STONEAGE_SPRITES_ROOT:-./assets/sprites}:/opt/stoneage/web-assets:ro
    ports:
      - ${STONEAGE_ADMIN_BIND:-127.0.0.1}:${STONEAGE_ADMIN_PORT:-18080}:8080
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  player-admin:
  auth-data:
    name: ${STONEAGE_AUTH_VOLUME:-stoneage-auth}
  operator-run:
    name: ${STONEAGE_OPERATOR_RUN_VOLUME:-stoneage-operator-run}
  operator-state:
    name: ${STONEAGE_OPERATOR_STATE_VOLUME:-stoneage-operator-state}

# File-backed Compose secrets keep object-storage credentials out of the rendered service
# environment and out of the web/admin containers. deploy.sh creates empty
# 0600 defaults when no upload credentials are configured, so ordinary game
# deployments do not need a storage account; an upload fails closed until both
# files contain values.
secrets:
  stoneage-oss-access-key-id:
    file: ${STONEAGE_ASSET_SYNC_ACCESS_KEY_FILE:-./config/secrets/oss-access-key-id}
  stoneage-oss-access-key-secret:
    file: ${STONEAGE_ASSET_SYNC_ACCESS_SECRET_FILE:-./config/secrets/oss-access-key-secret}

networks:
  # No host ports are published for GMSV/SAAC, so they remain private while
  # gateway/admin mappings continue to work on Docker Desktop and Linux.
  backend: {}
